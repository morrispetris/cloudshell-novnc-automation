[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24
autorestart=true
priority=10

[program:lxde]
command=/usr/bin/startlxde
environment=DISPLAY=":1"
autorestart=true
priority=20

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900
autorestart=true
priority=30

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc localhost:5900 --listen 80
autorestart=true
priority=40
